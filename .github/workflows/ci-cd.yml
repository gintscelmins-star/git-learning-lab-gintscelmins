name: Students file CI/CD

on:
  push:
    branches: [main, feature/marketplace-action] # Palaist pie push uz main vai jauno zaru
  pull_request:
    branches: [main] # Palaist, kad tiek veidots Pull Request uz main
  workflow_dispatch: # Aktivizē manuālo palaišanas pogu Actions sadaļā

jobs:
  check-students-file:
    runs-on: ubuntu-latest
    steps:
      # 1. Koda lejupielāde no konkrētā zara
      - name: Lejupieladet repozitorija kodu
        uses: actions/checkout@v4

      # 2. GitHub Marketplace Action faila eksistences pārbaudei
      - name: Parbaudit vai eksiste Students.md
        uses: andstor/file-existence-action@v3
        with:
          files: "Students.md"
          fail: true # Ja fails neeksistē, pipeline apstāsies ar kļūdu

      # 3. Satura attēlošana (pēc tam, kad Marketplace action apstiprinājis eksistenci)
      - name: Paradit Students.md saturu
        run: cat Students.md

      # 4. Demo soļi no oriģinālā uzdevuma
      - name: Testa solis
        run: echo "Parbaude veiksmigi izpildita"

      - name: Deploy (demo solis)
        if: success()
        run: echo "Deploy veiksmīgs"
