name: Students file CI/CD

on:
  push:
    branches: [main, feature/marketplace-action] # Aktivizējas uz abiem zariem
  pull_request:
    branches: [main]
  workflow_dispatch: # Atstājam arī manuālo palaišanu drošībai

jobs:
  check-students-file:
    runs-on: ubuntu-latest
    steps:
      - name: Lejupieladet repozitorija kodu
        uses: actions/checkout@v4

      # Marketplace Action konfigurācija ar mazo sākuma burtu
      - name: Parbaudit vai eksiste students.md
        uses: andstor/file-existence-action@v3
        with:
          files: "students.md" # Šeit nomainīts uz mazo "s"
          fail: true

      - name: Paradit students.md saturu
        run: cat students.md # Šeit arī nomainīts uz mazo "s"

      - name: Testa solis
        run: echo "Parbaude veiksmigi izpildita"

      - name: Deploy (demo solis)
        if: success()
        run: echo "Deploy veiksmīgs"
